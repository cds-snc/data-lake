name: ETL pull request tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terragrunt/aws/glue/etl/**"
      - "terragrunt/aws/glue/curated/**"
      - ".github/workflows/etl-pull-request.yml"

env:
  GLUE_BASE_PATH: terragrunt/aws/glue

jobs:
  glue-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ETL modules
          - module_type: etl
            module_path: bes/crm
          - module_type: etl  
            module_path: platform/gc_forms
          - module_type: etl
            module_path: platform/gc_notify
          - module_type: etl
            module_path: platform/support/freshdesk
          # Curated modules
          - module_type: curated
            module_path: platform/gc_notify
    steps:
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@58d95c286bfa233aec52055237b26a20c6ae13a5 # v1.2.1
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_SENTINELFORWARDINGMODE: "oidc"
          DNS_PROXY_SENTINELTENANTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_TENANT_ID }}"
          DNS_PROXY_SENTINELCLIENTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_CLIENT_ID }}"
          DNS_PROXY_SENTINELDCEURI: "${{ secrets.SENTINEL_DCE_ENDPOINT }}"
          DNS_PROXY_SENTINELDCRIMMUTABLEID: "${{ vars.SENTINEL_DCR_RULE_ID_DNS_PROXY }}"
          DNS_PROXY_SENTINELSTREAMNAME: Custom-GitHubMetadata_CI_DNS_Queries_V2_Input
          DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
          DNS_PROXY_WILDCARDGREEDY: "true"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: changes
        with:
          filters: |
            module:
              - '${{ env.GLUE_BASE_PATH }}/${{ matrix.module_type }}/${{ matrix.module_path }}/**'
              - '.github/workflows/etl-pull-request.yml'

      - name: Setup python
        if: steps.changes.outputs.module == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Setup Java
        if: steps.changes.outputs.module == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run PR tests
        if: steps.changes.outputs.module == 'true'
        working-directory: ${{ env.GLUE_BASE_PATH }}/${{ matrix.module_type }}/${{ matrix.module_path }}
        run: make ARGS=--check pull_request
